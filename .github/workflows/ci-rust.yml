# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "CI — Build & Test"

# Working Rust CI — generated by LaneSync.
# Runs cargo test, produces HTML reports, and uploads evidence to LaneSync.

on:
  pull_request:
    branches: [ "main", "release/*" ]
  push:
    branches: [ "main", "release/*" ]
  release:
    types: [published]

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust is pre-installed on ubuntu-latest runners.
      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Run unit tests
        run: |
          if [ -f Cargo.toml ]; then
            cargo test 2>&1 | tee test-output.txt || TEST_EXIT=$?
            echo "<html><body><h1>Unit Tests</h1><pre>$(cat test-output.txt | head -200)</pre></body></html>" > unit-tests.html
          else
            echo "No Cargo.toml found — skipping tests. Add a Cargo.toml to get started." > test-output.txt
            echo "<html><body><h1>Unit Tests</h1><p>No tests yet — add a Cargo.toml to get started.</p></body></html>" > unit-tests.html
          fi
          mkdir -p coverage
          [ -f coverage/index.html ] || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     cargo test --test integration 2>&1 | tee integration-output.txt || true
      #     echo "<html><body><h1>Integration Tests</h1><pre>$(cat integration-output.txt | head -200)</pre></body></html>" > integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          # Scan source only: generated reports and build output are not the customer's code.
          # Findings never fail CI (no --error), so a non-zero exit means the scan itself failed:
          # send no report rather than a partial one that reads as clean.
          if ! opengrep scan --config auto --exclude .github --exclude coverage --exclude unit-tests.html \
            --exclude integration-tests.html --exclude target \
            --sarif -o sast.sarif . 2>/dev/null; then
            echo "::warning::SAST scan did not complete; LaneSync will show SAST as not measured."
            rm -f sast.sarif
          fi

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            unit-tests.html
            integration-tests.html
            sast.sarif
            trivy.json
            test-output.txt
          retention-days: 30

      - name: Upload evidence to LaneSync
        uses: ./.github/actions/lanesync-upload
        if: always()
        with:
          api-url: ${{ vars.SDLC_API_URL || 'https://unrelishable-erika-nonfactiously.ngrok-free.dev' }}
          api-key: ${{ secrets.LANESYNC_API_KEY }}
          dev-branch: "main"
          release-prefix: "release/"
          pipeline: "CI — Build & Test"

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and Push Tag
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION=${BRANCH_NAME#release/}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEW_TAG"
            exit 0
          fi
          git tag "$NEW_TAG"
          if git push origin "$NEW_TAG"; then
            echo "Pushed tag: $NEW_TAG"
          else
            echo "GITHUB_TOKEN could not push ${NEW_TAG}. LaneSync creates it with the app installation token."
          fi
